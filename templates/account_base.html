<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Makako Tool{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height:100vh; background:linear-gradient(rgba(244,246,249,.75),rgba(244,246,249,.75)),url("{{ url_for('static', filename='img/Fondo-analisisip.jpg') }}") center / cover fixed; }
    .card { border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  </style>
</head>
<body>
<main class="container py-5">
  <h1 class="mb-4">Makako Tool</h1>
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
